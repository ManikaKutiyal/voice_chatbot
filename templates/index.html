<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groq Voice Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark">✦</div>
      <div>
        <h1>Voice Chatbot</h1>
      </div>
    </header>


    <section class="chat-card" aria-label="Chat">
      <div id="messages" class="messages" aria-live="polite">
        <div class="welcome-message">
          <div class="assistant-avatar">✦</div>
          <div class="bubble assistant-bubble">
            Hey! I'm ready when you are. You can start by saying hello or typing a question below.
          </div>
        </div>
      </div>

      <div id="errorBox" class="error-box" role="alert" hidden></div>

      <div class="controls">
        <button id="micButton" class="mic-button" type="button" title="Start voice recognition">
          <span class="mic-icon">🎙</span>
          <span id="micLabel">Start talking</span>
          <span class="mic-wave" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        </button>
        <label class="toggle-label">
          <input id="autoSpeak" type="checkbox" checked>
          <span>Speak replies</span>
        </label>
      </div>

      <form id="chatForm" class="composer">
        <input id="messageInput" type="text" autocomplete="off" placeholder="Type your message here…" aria-label="Your message">
        <button id="sendButton" type="submit" aria-label="Send message">Send <span>↗</span></button>
      </form>
    </section>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
